<!DOCTYPE html>
<html>
<head>
    <title>Digital Token System</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            text-align:center;
            margin-top:80px;
            background:#f4f4f4;
        }

        .container{
            width:500px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        button{
            padding:12px 25px;
            margin:10px;
            cursor:pointer;
            font-size:16px;
        }

        input{
            padding:12px;
            width:250px;
            font-size:16px;
        }

        #result{
            margin-top:25px;
        }

        .token{
            color:green;
            font-size:32px;
            font-weight:bold;
        }

        .rack{
            color:blue;
            font-size:24px;
            font-weight:bold;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>🏪 Digital Token System</h1>

    <button onclick="depositItem()">
        Deposit Item
    </button>

    <br><br>

    <input
        type="text"
        id="tokenInput"
        placeholder="Enter Token ID"
    >

    <button onclick="collectItem()">
        Collect Item
    </button>

    <div id="result"></div>

</div>

<script>

const API =
"https://digital-token-system.onrender.com/api";

async function depositItem(){

    const response =
    await fetch(`${API}/store`,{
        method:"POST"
    });

    const data =
    await response.json();

    document.getElementById("result").innerHTML =

    `
    <h2>✅ Item Stored Successfully</h2>

    <p>Your Token:</p>

    <div class="token">
        ${data.tokenId}
    </div>

    <br>

    <p>Allocated Rack:</p>

    <div class="rack">
        ${data.rackNumber}
    </div>

    <br>

    <p>
        Save this token to collect your item later.
    </p>
    `;
}

async function collectItem(){

    const tokenId =
    document.getElementById("tokenInput").value;

    if(!tokenId){
        alert("Enter Token ID");
        return;
    }

    const response =
    await fetch(`${API}/retrieve`,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            tokenId
        })
    });

    const data =
    await response.json();

    if(data.message){

        document.getElementById("result").innerHTML =
        `<h2>${data.message}</h2>`;

        return;
    }

    document.getElementById("result").innerHTML =

    `
    <h2>
        Collect Item From Rack
        ${data.rackNumber}
    </h2>
    `;
}

</script>

</body>
</html>
