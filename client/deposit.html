<!DOCTYPE html>
<html>
<head>
<title>Deposit Item</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
padding-top:60px;
margin:0;
}

.card{
width:90%;
max-width:400px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.15);
}

button{
padding:12px 20px;
font-size:16px;
cursor:pointer;
margin-top:10px;
border:none;
border-radius:6px;
background:#007bff;
color:white;
}

button:hover{
opacity:0.9;
}

.token{
font-size:28px;
color:green;
font-weight:bold;
word-break:break-word;
}

.rack{
font-size:22px;
color:blue;
font-weight:bold;
}

a{
display:block;
margin-top:20px;
text-decoration:none;
}

</style>
</head>

<body>

<div class="card">

<h1>📦 Deposit Item</h1>

<button onclick="depositItem()">
Generate Token
</button>

<div id="result"></div>

<a href="index.html">
⬅ Back Home
</a>

</div>

<script>

const API =
"https://digital-token-system.onrender.com/api";

async function depositItem(){

const response =
await fetch(`${API}/store`,{
method:"POST"
});

const data =
await response.json();

if(data.message){

document.getElementById("result").innerHTML =
`<h3>${data.message}</h3>`;

return;
}

document.getElementById("result").innerHTML =

`
<p>Your Token</p>

<div class="token">
${data.tokenId}
</div>

<p>Allocated Rack</p>

<div class="rack">
${data.rackNumber}
</div>

<br>

<button onclick="copyToken('${data.tokenId}')">
📋 Copy Token
</button>

<br><br>

<button onclick="
downloadReceipt(
'${data.tokenId}',
'${data.rackNumber}'
)">
📄 Download Receipt
</button>
`;

}

function copyToken(token){

navigator.clipboard.writeText(token);

alert("Token Copied Successfully");

}

function downloadReceipt(tokenId, rackNumber){

const now = new Date();

const receipt = `

SMART DIGITAL CLOAKROOM MANAGEMENT SYSTEM

========================================

RECEIPT

Token ID:
${tokenId}

Allocated Rack:
${rackNumber}

Issued On:
${now.toLocaleString()}

========================================

IMPORTANT:

• Keep this token safe.

• You must provide this token while
  collecting your item.

• Do not share the token with others.

========================================

Thank You

`;

const blob = new Blob(
[receipt],
{ type: "text/plain" }
);

const link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
`${tokenId}_receipt.txt`;

document.body.appendChild(link);

link.click();

document.body.removeChild(link);

}

</script>

</body>
</html>
